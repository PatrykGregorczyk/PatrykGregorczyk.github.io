                }

                let team = [];
                const rawTeam = raw.team ?? raw.crew ?? raw.people ?? raw.sklad ?? raw.staff ?? raw.workers ?? raw.osoby;
                if (Array.isArray(rawTeam)) {
                    team = rawTeam.map(p => String(p || '').trim()).filter(Boolean);
                } else if (typeof rawTeam === 'string' && rawTeam.trim()) {
                    team = rawTeam.split(/[\n,;]+/).map(p => p.trim()).filter(Boolean);
                }

                const tasks = String(raw.tasks ?? raw.prace ?? raw.work ?? raw.description ?? raw.opis ?? raw.notes ?? '').trim();

                return {
                    id: raw.id ? String(raw.id) : generateId(),
                    date: date,
                    type: type,
                    start: start,
                    end: end,
                    team: type === 'work' ? team : [],
                    tasks: tasks
                };
            }

            function parseImportedPayload(parsed) {
                let rawEntries = [];
                let owner = '';
                let people = [];

                if (Array.isArray(parsed)) {
                    rawEntries = parsed;
                } else if (parsed && typeof parsed === 'object') {
                    const entryKey = ['entries', 'days', 'rows', 'wpisy', 'records', 'logs', 'items', 'data'].find(
                        k => Array.isArray(parsed[k])
                    );
                    if (entryKey) rawEntries = parsed[entryKey];

                    const ownerKey = ['owner', 'name', 'worker', 'userName', 'ownerName', 'workerName', 'employee', 'osoba', 'imie'].find(
                        k => typeof parsed[k] === 'string' && parsed[k].trim() !== ''
                    );
                    if (ownerKey) owner = parsed[ownerKey].trim();

                    const peopleKey = ['people', 'crew', 'staff', 'sklad', 'workers', 'savedPeople', 'persons', 'team', 'members'].find(
                        k => Array.isArray(parsed[k])
                    );
                    if (peopleKey) {
                        people = parsed[peopleKey].map(p => String(p || '').trim()).filter(Boolean);
                    }
                }

                const entries = rawEntries.map(normalizeImportedEntry).filter(Boolean);

                entries.forEach(function (entry) {
                    if (Array.isArray(entry.team)) {
                        entry.team.forEach(function (person) {
                            if (person && !people.includes(person)) {
                                people.push(person);
                            }
                        });
                    }
                });

                return { entries: entries, owner: owner, people: people };
            }

            function applyImportedData(data, mode) {
                if (mode === 'replace') {
                    state.entries = data.entries.map(e => Object.assign({}, e, { id: generateId() }));
                    if (data.owner) {
                        state.owner = data.owner;
                        els.ownerName.value = state.owner;
                        saveOwner();
                    }
                    if (data.people.length > 0) {
                        state.people = data.people.slice();
                        state.selectedTeam = state.selectedTeam.filter(p => state.people.includes(p));
                        savePeople();
                    }
                } else {
                    const appended = data.entries.map(e => Object.assign({}, e, { id: generateId() }));
                    state.entries = state.entries.concat(appended);
                    if (!state.owner && data.owner) {
                        state.owner = data.owner;
                        els.ownerName.value = state.owner;
                        saveOwner();
                    }
                    data.people.forEach(function (p) {
                        if (!state.people.includes(p)) {
                            state.people.push(p);
                        }
                    });
                    savePeople();
                }

                saveEntries();
                renderCrewChips();
                renderEntries();
                showToast(`Zaimportowano ${data.entries.length} wpisów.`);
            }

            function handleImportFile(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function () {
                    try {
                        const parsed = JSON.parse(String(reader.result || ''));
                        const normalized = parseImportedPayload(parsed);

                        if (normalized.entries.length === 0 && !normalized.owner && normalized.people.length === 0) {
                            showToast('Plik nie zawiera rozpoznawalnych danych.', true);
                            return;
                        }

                        if (state.entries.length > 0) {
                            openModal(
                                'Import danych',
                                `Znaleziono ${normalized.entries.length} wpisów. W tabeli są już zapisane dni — wybierz sposób wczytania:`,
                                [
                                    { label: 'Anuluj', cls: 'btn-tonal' },
                                    { label: 'Dopisz', cls: 'btn-share', onClick: function () { applyImportedData(normalized, 'append'); } },
                                    { label: 'Zastąp', cls: 'btn-danger', onClick: function () { applyImportedData(normalized, 'replace'); } }
                                ]
                            );
                        } else {
                            applyImportedData(normalized, 'replace');
                        }
                    } catch (err) {
                        showToast('Błąd odczytu pliku kopii.', true);
                    }
                };
                reader.onerror = function () {
                    showToast('Nie udało się odczytać pliku.', true);
                };
                reader.readAsText(file, 'utf-8');
            }

            /* =========================================================
               KLASYCZNY, CZARNO-BIAŁY PDF Z JEDNOWIERSZOWYM NAGŁÓWKIEM
               ========================================================= */
            function stripPolish(text) {
                const map = {
                    'ą': 'a', 'ć': 'c', 'ę': 'e', 'ł': 'l', 'ń': 'n', 'ó': 'o', 'ś': 's', 'ź': 'z', 'ż': 'z',
                    'Ą': 'A', 'Ć': 'C', 'Ę': 'E', 'Ł': 'L', 'Ń': 'N', 'Ó': 'O', 'Ś': 'S', 'Ź': 'Z', 'Ż': 'Z'
                };
                return String(text || '').replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, ch => map[ch] || ch);
            }

            async function fetchFontBase64(url) {
                const resp = await fetch(url);
                if (!resp.ok) return null;
                const buf = await resp.arrayBuffer();
                const bytes = new Uint8Array(buf);
                let binary = '';
                const chunk = 0x8000;
                for (let i = 0; i < bytes.length; i += chunk) {
                    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
                }
                return btoa(binary);
            }

            async function loadRobotoFonts() {
                if (cachedFonts) return cachedFonts;
                try {
                    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/';
                    const [regular, bold] = await Promise.all([
                        fetchFontBase64(base + 'Roboto-Regular.ttf'),
                        fetchFontBase64(base + 'Roboto-Medium.ttf')
                    ]);
                    if (regular) {
                        cachedFonts = { regular: regular, bold: bold || regular };
                        return cachedFonts;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            }

            /* Wykrywa okres do prawej części nagłówka PDF, np. "Listopad 2026" lub "Październik – Listopad 2026" */
            function detectMonthYearLabel(sorted) {
                if (!sorted || sorted.length === 0) {
                    const now = new Date();
                    return `${MONTHS_PL[now.getMonth()]} ${now.getFullYear()}`;
                }

                const ymList = [];
                sorted.forEach(function (entry) {
                    const m = String(entry.date || '').match(/^(\d{4})-(\d{2})-/);
                    if (m) {
                        const key = `${m[1]}-${m[2]}`;
                        if (!ymList.includes(key)) ymList.push(key);
                    }
                });

                if (ymList.length === 0) {
                    const now = new Date();
                    return `${MONTHS_PL[now.getMonth()]} ${now.getFullYear()}`;
                }

                const first = ymList[0].split('-');
                const last = ymList[ymList.length - 1].split('-');
                const fY = first[0];
                const fM = parseInt(first[1], 10) - 1;
                const lY = last[0];
                const lM = parseInt(last[1], 10) - 1;

                if (ymList.length === 1) {
                    return `${MONTHS_PL[fM]} ${fY}`;
                }
                if (fY === lY) {
                    return `${MONTHS_PL[fM]} – ${MONTHS_PL[lM]} ${fY}`;
                }
                return `${MONTHS_PL[fM]} ${fY} – ${MONTHS_PL[lM]} ${lY}`;
            }

            async function buildPdfDocument() {
                if (!window.jspdf || !window.jspdf.jsPDF) {
                    throw new Error('NO_JSPDF');
                }

                const sorted = getSortedEntries();
                const jsPDFCtor = window.jspdf.jsPDF;
                const doc = new jsPDFCtor({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const pageWidth = doc.internal.pageSize.getWidth(); // 210mm
                const marginX = 10;

                const fonts = await loadRobotoFonts();
                let useUnicode = false;
                if (fonts && fonts.regular) {
                    try {
                        doc.addFileToVFS('Roboto-Regular.ttf', fonts.regular);
                        doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
                        doc.addFileToVFS('Roboto-Bold.ttf', fonts.bold);
                        doc.addFont('Roboto-Bold.ttf', 'Roboto', 'bold');
                        doc.setFont('Roboto', 'normal');
                        useUnicode = true;
                    } catch (e) {
                        useUnicode = false;
                    }
                }

                const fontName = useUnicode ? 'Roboto' : 'helvetica';
                const txt = function (s) {
                    return useUnicode ? String(s || '') : stripPolish(s);
                };

                // Minimalny jednowierszowy nagłówek:
                // Lewa: Imię i nazwisko | Środek (bold): KARTA PRACY | Prawa: Listopad 2026
                const headerY = 13;
                const ownerText = state.owner.trim();
                const periodText = detectMonthYearLabel(sorted);

                doc.setTextColor(0, 0, 0);

                if (ownerText) {
                    doc.setFont(fontName, 'normal');
                    doc.setFontSize(10.5);
                    doc.text(txt(ownerText), marginX, headerY, { align: 'left' });
                }

                doc.setFont(fontName, 'bold');
                doc.setFontSize(12);
                doc.text(txt('KARTA PRACY'), pageWidth / 2, headerY, { align: 'center' });

                doc.setFont(fontName, 'normal');
                doc.setFontSize(10.5);
                doc.text(txt(periodText), pageWidth - marginX, headerY, { align: 'right' });

                // Przygotowanie wierszy tabeli
                let totalHours = 0;
                let uwCount = 0;
                let uoCount = 0;
                let l4Count = 0;

                const bodyRows = sorted.map(function (entry) {
                    const type = entry.type || 'work';
                    const isWork = type === 'work';
                    let hoursCell = type;
                    let crewCell = '';

                    if (isWork) {
                        const hrs = calcHours(entry.start, entry.end);
                        totalHours += hrs;
                        hoursCell = `${formatSingleTime(entry.start)} - ${formatSingleTime(entry.end)} (${formatHours(hrs, true)})`;
                        crewCell = Array.isArray(entry.team) && entry.team.length ? entry.team.join('\n') : '';
                    } else {
                        if (type === 'UW') uwCount += 1;
                        if (type === 'UO') uoCount += 1;
                        if (type === 'L4') l4Count += 1;
                    }

                    return [
                        txt(formatDatePL(entry.date)),
                        txt(hoursCell),
                        txt(crewCell),
                        txt(entry.tasks || '')
                    ];
                });

                // Klasyczna czarno-biała tabela jak papierowa karta pracy
                if (typeof doc.autoTable === 'function') {
                    doc.autoTable({
                        startY: 17,
                        head: [[
                            txt('Data'),
                            txt('Godziny pracy'),
                            txt('Skład osobowy'),
                            txt('Wykonane prace')
                        ]],
                        body: bodyRows,
                        theme: 'grid',
                        styles: {
                            font: fontName,
                            fontSize: 9,
                            cellPadding: 2.2,
                            fillColor: [255, 255, 255],
                            textColor: [0, 0, 0],
                            lineColor: [40, 40, 40],
                            lineWidth: 0.25,
                            valign: 'top'
                        },
                        headStyles: {
                            fillColor: [242, 242, 242],
                            textColor: [0, 0, 0],
                            fontStyle: 'bold',
                            halign: 'center',
                            valign: 'middle',
                            lineColor: [40, 40, 40],
                            lineWidth: 0.25
                        },
                        columnStyles: {
                            0: { cellWidth: 23, halign: 'center' },
                            1: { cellWidth: 36, halign: 'center' },
                            2: { cellWidth: 32, halign: 'left' },
                            3: { cellWidth: 'auto', halign: 'left' }
                        },
                        margin: { left: marginX, right: marginX, bottom: 12 }
                    });
                }

                // Zwarty wiersz podsumowania na dole (BEZ daty i podpisu pracownika)
                const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY + 6 : 24;
                const summaryParts = [`Suma godzin: ${formatHours(totalHours, false)}`];
                if (uwCount > 0) summaryParts.push(`UW: ${uwCount}`);
                if (uoCount > 0) summaryParts.push(`UO: ${uoCount}`);
                if (l4Count > 0) summaryParts.push(`L4: ${l4Count}`);

                doc.setFont(fontName, 'bold');
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);
                doc.text(txt(summaryParts.join('   |   ')), marginX, finalY);

                const safeOwner = ownerText
                    ? '_' + stripPolish(ownerText).replace(/[^a-zA-Z0-9]+/g, '_')
                    : '';
                const filename = `karta_pracy${safeOwner}_${getTodayISO()}.pdf`;

                return { doc: doc, filename: filename };
            }

            async function handlePdfAction(mode) {
                if (state.entries.length === 0) {
                    showToast('Dodaj przynajmniej jeden wpis przed wygenerowaniem PDF.', true);
                    return;
                }

                const btn = mode === 'share' ? els.sharePdfBtn : els.downloadPdfBtn;
                btn.disabled = true;

                try {
                    const result = await buildPdfDocument();
                    if (mode === 'share' && navigator.share) {
                        const pdfBlob = result.doc.output('blob');
                        const file = new File([pdfBlob], result.filename, { type: 'application/pdf' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: 'Karta Pracy',
                                files: [file]
                            });
                            showToast('Udostępniono plik.');
                            return;
                        }
                    }

                    result.doc.save(result.filename);
                    showToast('Pobrano kartę pracy.');
                } catch (err) {
                    if (err && err.name === 'AbortError') return;
                    if (err && err.message === 'NO_JSPDF') {
                        showToast('Brak biblioteki PDF offline — otwieram drukowanie.', true);
                        window.print();
                    } else {
                        showToast('Nie udało się wygenerować PDF.', true);
                    }
                } finally {
                    btn.disabled = false;
                }
            }

            /* =========================================================
               PODPIĘCIE ZDARZEŃ
               ========================================================= */
            els.ownerName.addEventListener('input', function () {
                state.owner = els.ownerName.value;
                saveOwner();
            });

            els.themeToggleBtn.addEventListener('click', function () {
                applyTheme(state.theme === 'dark' ? 'light' : 'dark');
            });

            els.sharePdfBtn.addEventListener('click', function () {
                handlePdfAction('share');
            });

            els.downloadPdfBtn.addEventListener('click', function () {
                handlePdfAction('download');
            });

            els.importJsonBtn.addEventListener('click', function () {
                els.importJsonInput.value = '';
                els.importJsonInput.click();
            });

            els.importJsonInput.addEventListener('change', function () {
                const file = els.importJsonInput.files && els.importJsonInput.files[0];
                if (file) handleImportFile(file);
            });

            els.exportJsonBtn.addEventListener('click', exportJSON);

            els.repeatLastBtn.addEventListener('click', repeatLastEntry);

            els.statusBtns.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    setStatus(btn.dataset.status, true);
                });
            });

            els.timeStart.addEventListener('change', updateDurationDisplay);
            els.timeEnd.addEventListener('change', function () {
                updateDurationDisplay();
                syncQuickEndHighlight();
            });

            els.addPersonBtn.addEventListener('click', addPersonFromInput);
            els.personInput.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter') {
                    ev.preventDefault();
                    addPersonFromInput();
                }
            });

            els.clearTasksBtn.addEventListener('click', function () {
                els.entryTasks.value = '';
                els.entryTasks.focus();
            });

            els.cancelEditBtn.addEventListener('click', function () {
                resetForm(true);
                showToast('Anulowano edycję.');
            });

            els.entryForm.addEventListener('submit', handleFormSubmit);

            els.entriesTbody.addEventListener('click', function (ev) {
                const btn = ev.target.closest('button[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;
                const id = btn.dataset.id;

                if (action === 'edit') {
                    startEditEntry(id);
                } else if (action === 'delete') {
                    const entry = state.entries.find(e => e.id === id);
                    if (!entry) return;
                    openModal(
                        'Usuń wpis',
                        `Czy na pewno usunąć wpis z dnia ${formatDatePL(entry.date)}?`,
                        [
                            { label: 'Anuluj', cls: 'btn-tonal' },
                            {
                                label: 'Usuń',
                                cls: 'btn-danger',
                                onClick: function () {
                                    state.entries = state.entries.filter(e => e.id !== id);
                                    if (els.editId.value === id) resetForm(true);
                                    saveEntries();
                                    renderEntries();
                                    showToast('Usunięto wpis.');
                                }
                            }
                        ]
                    );
                }
            });

            els.clearAllBtn.addEventListener('click', function () {
                if (state.entries.length === 0) {
                    showToast('Tabela jest już pusta.');
                    return;
                }
                openModal(
                    'Wyczyść wszystkie wpisy',
                    `Czy na pewno usunąć wszystkie wpisy (${state.entries.length})? Lista osób oraz imię i nazwisko zostaną zachowane.`,
                    [
                        { label: 'Anuluj', cls: 'btn-tonal' },
                        {
                            label: 'Wyczyść',
                            cls: 'btn-danger',
                            onClick: function () {
                                state.entries = [];
                                saveEntries();
                                resetForm(true);
                                renderEntries();
                                showToast('Wyczyszczono wszystkie wpisy.');
                            }
                        }
                    ]
                );
            });

            els.modal.addEventListener('click', function (ev) {
                if (ev.target === els.modal) closeModal();
            });

            document.addEventListener('keydown', function (ev) {
                if (ev.key === 'Escape' && els.modal.classList.contains('open')) {
                    closeModal();
                }
            });

            /* =========================================================
               START APLIKACJI
               ========================================================= */
            loadState();
            applyTheme(state.theme);
            els.ownerName.value = state.owner;
            populateTimeSelects();
            buildQuickEndTiles();
            resetForm(false);
            renderEntries();
        });
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
